# ~/.config/kitty/kitty.conf

# ── Font ──────────────────────────────────────────────
font_family            JetBrainsMono Nerd Font
bold_font              auto
italic_font            auto
bold_italic_font       auto
font_size              15.0
adjust_line_height     105%
disable_ligatures      cursor
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono

# ── Cursor ────────────────────────────────────────────
cursor_shape           beam
cursor_beam_thickness  1.5
cursor_blink_interval  0
cursor_trail           1
cursor_trail_decay     0.1 0.4
cursor_trail_start_threshold 2

# ── Scrollback ────────────────────────────────────────
scrollback_lines       10000
scrollback_pager_history_size 64
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 2.0

# ── Mouse ─────────────────────────────────────────────
mouse_hide_wait        3.0
url_style              curly
open_url_with          default
copy_on_select         clipboard
strip_trailing_spaces  smart
focus_follows_mouse    no

# ── Performance ───────────────────────────────────────
repaint_delay          10
input_delay            3
sync_to_monitor        yes

# ── Bell ──────────────────────────────────────────────
enable_audio_bell      no
visual_bell_duration   0.0
window_alert_on_bell   yes

# ── Window ────────────────────────────────────────────
remember_window_size   no
initial_window_width   110c
initial_window_height  32c
window_padding_width   14 18
placement_strategy     center
hide_window_decorations yes
confirm_os_window_close 0
background_opacity     0.85
dynamic_background_opacity yes
window_border_width    0
draw_minimal_borders   yes
inactive_text_alpha    0.7
enabled_layouts        splits,stack,tall

# ── Tab bar ───────────────────────────────────────────
tab_bar_edge           bottom
tab_bar_style          powerline
tab_powerline_style    round
tab_bar_min_tabs       2
tab_title_template     "{index}: {title[:24]}"
active_tab_title_template "{index}: {title[:24]}"
tab_activity_symbol    " "

# ── Colors: vivid neon on near-black ──────────────────
foreground             #f2f2ff
background             #0a0a12
selection_foreground   #0a0a12
selection_background   #ffd23f
cursor                 #ff2e97
cursor_text_color      #0a0a12
url_color              #00f0ff

active_border_color    #ff2e97
inactive_border_color  #2a2a40
bell_border_color      #ffd60a

active_tab_foreground   #0a0a12
active_tab_background   #ff2e97
inactive_tab_foreground #9a9ac0
inactive_tab_background #14141f
tab_bar_background      #06060c
tab_bar_margin_color    #06060c

mark1_foreground       #0a0a12
mark1_background       #00f0ff
mark2_foreground       #0a0a12
mark2_background       #ff2ecb
mark3_foreground       #0a0a12
mark3_background       #00ff87

# black
color0                 #1c1c2e
color8                 #4a4a6a
# red
color1                 #ff2d55
color9                 #ff5c7a
# green
color2                 #00ff87
color10                #5cffa8
# yellow
color3                 #ffd60a
color11                #ffe44d
# blue
color4                 #2e7bff
color12                #5c9dff
# magenta
color5                 #ff2ecb
color13                #ff66dc
# cyan
color6                 #00f0ff
color14                #5cf6ff
# white
color7                 #d0d0ea
color15                #ffffff

# ── Shell ─────────────────────────────────────────────
shell                  .
allow_remote_control   no
update_check_interval  0
term                   xterm-kitty

# ── Keybinds ──────────────────────────────────────────
clear_all_shortcuts    no
kitty_mod              ctrl+shift

map kitty_mod+c        copy_to_clipboard
map kitty_mod+v        paste_from_clipboard
map kitty_mod+equal    change_font_size all +1.0
map kitty_mod+minus    change_font_size all -1.0
map kitty_mod+backspace change_font_size all 0

map kitty_mod+enter    launch --location=split --cwd=current
map kitty_mod+\        launch --location=vsplit --cwd=current
map kitty_mod+-        launch --location=hsplit --cwd=current
map kitty_mod+z        toggle_layout stack
map kitty_mod+h        neighboring_window left
map kitty_mod+l        neighboring_window right
map kitty_mod+k        neighboring_window up
map kitty_mod+j        neighboring_window down

map kitty_mod+t        new_tab_with_cwd
map kitty_mod+right    next_tab
map kitty_mod+left     previous_tab
map kitty_mod+q        close_tab

map kitty_mod+u        kitten unicode_input
map kitty_mod+f5       load_config_file