config_version = 16

[accessibility]
ui_scale = 1.300000011920929

[audio]
enable_overdrive = true
sound_volume = 0.99999997764825821

[bar]
order = [ "top-bar" ]

    [bar.top-bar]
    background_opacity = 0.59999998658895493
    center = [ "media" ]
    end = [
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "control-center",
        "session"
    ]
    font_family = "Xmind SemiBold"
    font_scale = 1.0099999848753214
    font_weight = 600
    margin_ends = 0
    padding = 20
    radius = 0
    reserve_space = false
    scale = 1.300000011920929
    smart_auto_hide = true
    start = [ "launcher", "wallpaper", "workspaces", "clock" ]
    thickness = 45
    widget_spacing = 32

[battery]
warning_threshold = 30

[control_center]
hidden_tabs = [ "monitor" ]
show_avatar_border = false
sidebar = "full"
sidebar_section = "full"
width = 800

    [control_center.calendar]
    show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 24
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 720.0
    box_width = 1920.0
    cx = 960.0
    cy = 718.76171875
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        background_opacity = 0.0
        background_padding = 0
        background_radius = 0
        bands = 40
        centered = false
        color_1 = "surface_container_highest"
        color_2 = "surface_container_high"
        mirrored = true
        reversed = true
        show_wave = false
        show_when_idle = false

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 96.0
    box_width = 312.0
    cx = 960.0
    cy = 108.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false
        background_color = "surface"
        background_opacity = 0.10000000000000001
        background_padding = 5
        background_radius = 32
        center_text = true
        circle = true
        clock_style = "digital"
        color = "on_error"
        font_family = "Xmind SemiBold"
        format = "{:%I:%M %p}"
        shadow = false
        show_seconds = true
        timezone = ""

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 240.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 300.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 150.0

[location]
auto_locate = true

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
app_icon_color = "primary"
avatar_path = "/home/steve/Downloads/cat.png"
font_family = "Xmind SemiBold"
screen_time_enabled = true
time_format = "{:%-I:%M %p}"

    [shell.launcher]
    app_grid = true
    category_icons_only = true
    layout = "simple"
    pinned = [ "brave-browser", "kitty", "org.gnome.Nautilus", "com.spotify.Client" ]
    show_app_actions = true

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"
    launcher_placement = "attached"
    wallpaper_placement = "floating"
    wallpaper_show_names = false

[theme]
builtin = "Gruvbox"
community_palette = "Zenbones"
custom_palette = "6-mo"
mode = "dark"
shell_mode = "dark"
source = "custom"
wallpaper_scheme = "m3-monochrome"

[wallpaper]
directory = "/home/steve/Downloads/walls/walls1"
directory_dark = "/home/steve/Downloads/walls/walls1"
directory_light = "/home/steve/Downloads/walls/walls1"
edge_smoothness = 0.39999999105930328
fill_mode = "stretch"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 180

    [wallpaper.default]
    path = "/home/steve/Downloads/walls/walls1/8.png"

    [wallpaper.last]
    path = "/home/steve/Downloads/walls/walls1/8.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/steve/Downloads/walls/walls1/8.png"

[widget.battery]
display_mode = "graphic"
font_scale = 0.93999999999999995
scale = 0.94999999999999996

[widget.clock]
format = "{:%-I:%M %p}"

[widget.control-center]
enabled = false

[widget.media]
art_size = 30
hide_when_no_media = true
max_length = 580
min_length = 65
scale = 0.85000000000000009